<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>

    <!-- Gavel and Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" /> <!-- Purple-500 -->
      <stop offset="100%" stop-color="#6366f1" /> <!-- Indigo-500 -->
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" /> <!-- Amber-400 -->
      <stop offset="100%" stop-color="#f59e0b" /> <!-- Amber-500 -->
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" /> <!-- Blue-500 -->
      <stop offset="100%" stop-color="#1d4ed8" /> <!-- Blue-700 -->
    </linearGradient>

    <!-- Glow Filter for Web3 Premium Aesthetic -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Card with Dark Web3 Background -->
  <rect width="500" height="500" rx="90" fill="url(#bgGrad)" />

  <!-- Blockchain Grid Network (Subtle Background Graphic) -->
  <g stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.08" fill="none">
    <circle cx="250" cy="250" r="180" stroke-dasharray="10 10" />
    <circle cx="250" cy="250" r="120" />
    <line x1="250" y1="70" x2="250" y2="430" />
    <line x1="70" y1="250" x2="430" y2="250" />
    <line x1="122" y1="122" x2="378" y2="378" />
    <line x1="122" y1="378" x2="378" y2="122" />
  </g>

  <!-- Decentralized Nodes (Outer Ring) -->
  <g fill="url(#primaryGrad)" filter="url(#glow)">
    <circle cx="250" cy="70" r="10" />
    <circle cx="250" cy="430" r="10" />
    <circle cx="70" cy="250" r="10" />
    <circle cx="430" cy="250" r="10" />
    <circle cx="122" cy="122" r="8" />
    <circle cx="378" cy="122" r="8" />
    <circle cx="122" cy="378" r="8" />
    <circle cx="378" cy="378" r="8" />
  </g>

  <!-- Central Smart Contract Shield (Decentralized Trust) -->
  <path d="M250,110 L340,150 L340,260 C340,320 300,365 250,385 C200,365 160,320 160,260 L160,150 Z" 
        fill="url(#shieldGrad)" fill-opacity="0.15" stroke="url(#primaryGrad)" stroke-width="3" stroke-linecap="round" />

  <!-- Premium Abstract Gavel Block (Base) -->
  <path d="M190,320 L310,320 L290,345 L210,345 Z" fill="url(#primaryGrad)" />
  <rect x="180" y="345" width="140" height="8" rx="4" fill="url(#primaryGrad)" opacity="0.8" />

  <!-- Gavel Handle and Head (Rotating Action Axis) -->
  <g transform="translate(250,225) rotate(-35) translate(-250,-225)">
    <!-- Handle -->
    <rect x="242" y="190" width="16" height="150" rx="8" fill="url(#primaryGrad)" />
    <rect x="238" y="325" width="24" height="20" rx="6" fill="url(#goldGrad)" />
    
    <!-- Gavel Head Joint -->
    <rect x="235" y="165" width="30" height="25" rx="4" fill="url(#primaryGrad)" />
    
    <!-- Gavel Head (Cylinder) -->
    <rect x="190" y="125" width="120" height="40" rx="8" fill="url(#primaryGrad)" />
    
    <!-- Gold Plates on Gavel Head (Premium Accents) -->
    <rect x="185" y="130" width="10" height="30" rx="3" fill="url(#goldGrad)" />
    <rect x="305" y="130" width="10" height="30" rx="3" fill="url(#goldGrad)" />
    <rect x="246" y="125" width="8" height="40" fill="url(#goldGrad)" />
  </g>

  <!-- Sparkles / Verification Stars (Successful Tendering) -->
  <g fill="url(#goldGrad)" filter="url(#glow)">
    <!-- Star 1 -->
    <path d="M135,180 Q145,180 145,170 Q145,180 155,180 Q145,180 145,190 Q145,180 135,180 Z" />
    <!-- Star 2 -->
    <path d="M340,290 Q346,290 346,284 Q346,290 352,290 Q346,290 346,296 Q346,290 340,290 Z" />
  </g>
</svg>
